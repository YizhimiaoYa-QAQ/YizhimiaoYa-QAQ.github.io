# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Hexo
subtitle: ''
description: ''
keywords:
author: John Doe
language: en
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: http://YizhimiaoYa-QAQ.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: hsad
# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''
comments:
  enable: true
  active: giscus
  lazyload: true
  storage: true

giscus:
  enable: true
  repo: YizhimiaoYa-QAQ/YizhimiaoYa-QAQ.github.io
  repo_id: R_kgDOVWEWVw
  category: Announcements
  category_id: DIC_kwDOVWEWV84DKBra
  mapping: pathname
  strict: 0
  reactions_enabled: 1
  emit_metadata: 0
  input_position: top
  theme: preferred_color_scheme
  lang: zh-CN
  loading: lazy
  
seo:
  # HTML 压缩
  html:
    enable: true
    fix: true # 修复无效的 HTML
    exclude:
      - "*.min.{htm,html}"

  # CSS 压缩
  css:
    enable: true
    exclude:
      - "**/*.min.css"

  # JS 压缩
  js:
    enable: true
    concat: false # 保持 false，避免与其它压缩插件冲突
    exclude:
      - "**/*.min.js"

  # Rich Snippets (结构化数据)
  schema:
    article:
      enable: true # 为文章生成结构化数据
    breadcrumb:
      enable: true # 生成面包屑导航数据
    sitelink:
      enable: true
      searchUrl: https://YizhimiaoYa-QAQ.github.io/search?q={search_term_string} # 站内搜索地址
    homepage:
      enable: false # 作者注明此项仍在开发中，建议先关闭

  # 图片处理
  img:
    enable: true
    broken: false # 不建议开启，处理损坏图片可能导致内存溢出
  sitemap: true